<script>
  /* Avant le premier rendu : thème et langue, pour éviter tout flash. */
  (function () {
    var d = document.documentElement, store = null;
    d.className += ' js';
    try { store = window.localStorage; } catch (e) {}
    function get(k) { try { return store && store.getItem(k); } catch (e) { return null; } }
    var theme = get('am_theme');
    if (theme !== 'light' && theme !== 'dark') {
      theme = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    d.setAttribute('data-theme', theme);
    var lang = null;
    try { lang = new URLSearchParams(location.search).get('lang'); } catch (e) {}
    if (lang !== 'fr' && lang !== 'en') lang = get('am_lang');
    if (lang !== 'fr' && lang !== 'en') lang = /^fr/i.test(navigator.language || '') ? 'fr' : 'en';
    d.lang = lang;
  })();
</script>
